# Tests and exports the Godot web build on every push, then publishes it to the gh-pages branch:
#   main -> /, other branches -> /branch/<name>/, tags v* -> /v/<version>/.
# Deleting a branch removes its folder. Pages must serve the gh-pages branch (root).
name: Web build

on:
  push:
    branches: ['**', '!gh-pages']
    tags: ['v*']
  delete:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

permissions:
  contents: write  # to push to gh-pages

jobs:
  build:
    if: github.event_name != 'delete'
    runs-on: ubuntu-24.04
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Godot and web export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSLo templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d "$dest"
          rm godot.zip templates.tpz

      - name: Stamp the build label shown in the game
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then label="$GITHUB_REF_NAME"; else label="$GITHUB_REF_NAME @ ${GITHUB_SHA::7}"; fi
          label=${label//\\/\\\\}  # escape backslashes and quotes for the GDScript string
          label=${label//\"/\\\"}
          printf '## Generated by CI.\nextends RefCounted\n\nconst LABEL := "%s"\n' "$label" > presentation/build_info.gd

      - name: Import project
        run: godot --headless --import

      - name: Run unit tests
        shell: bash
        # GUT can exit 0 and still print "All tests passed" when a script fails to parse (that test file
        # is just skipped), so require the summary line and reject any script error.
        run: |
          godot --headless -s addons/gut/gut_cmdln.gd -gexit 2>&1 | tee gut.log
          grep -q "All tests passed" gut.log
          ! grep -q "SCRIPT ERROR" gut.log

      - name: Test the publish script
        run: bash tests/publish_pages_test.sh

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.pck

      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          tools/publish_pages.sh publish build/web "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME"

  remove-branch:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Remove the deleted branch's build
        env:
          DELETED_BRANCH: ${{ github.event.ref }}  # via env, never pasted into the script (injection)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          tools/publish_pages.sh remove "$DELETED_BRANCH"
