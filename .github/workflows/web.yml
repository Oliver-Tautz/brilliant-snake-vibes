# Tests and exports the Godot web build on every push; deploys to GitHub Pages from main.
name: Web build

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a deploy from main halfway; superseded branch builds can go.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and web export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSLo templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d "$dest"
          rm godot.zip templates.tpz

      - name: Import project
        run: godot --headless --import

      - name: Run unit tests
        shell: bash
        # GUT can exit 0 and still print "All tests passed" when a script fails to parse (that test file
        # is just skipped), so require the summary line and reject any script error.
        run: |
          godot --headless -s addons/gut/gut_cmdln.gd -gexit 2>&1 | tee gut.log
          grep -q "All tests passed" gut.log
          ! grep -q "SCRIPT ERROR" gut.log

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.pck

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
